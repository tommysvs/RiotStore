<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto - Riot Merch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/custom.css">
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico" />
</head>
<body class="bg-white text-gray-900 font-sans">
    <nav id="navbar-container" class="bg-black sticky top-0 z-50 shadow-md"></nav>
    <main id="main-content">
        <div id="breadcrumb-container"></div>

        <section class="max-w-7xl mx-auto px-4 py-12">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                <div class="flex flex-col gap-4">
                    <div class="aspect-square bg-gray-100 border border-gray-200 overflow-hidden">
                        <img id="product-image" src="" alt="" class="w-full h-full object-cover">
                    </div>
                </div>

                <div class="flex flex-col justify-start">
                    <p id="product-sku" class="text-red-600 text-xs uppercase tracking-wider font-bold mb-4"></p>
                    <h1 id="product-name" class="text-4xl font-black text-gray-900 uppercase tracking-tight mb-6"></h1>
                    <p id="product-description" class="text-gray-600 text-lg leading-relaxed mb-8"></p>

                    <div class="mb-8">
                        <p class="text-gray-700 uppercase text-sm tracking-wider mb-2 font-bold">Precio</p>
                        <p id="product-price" class="text-5xl font-black text-gray-900"></p>
                    </div>

                    <div class="mb-8">
                        <p class="text-gray-700 uppercase text-sm tracking-wider mb-4 font-bold">Cantidad</p>
                        <div class="flex gap-4 items-center">
                            <button id="qty-minus" class="w-12 h-12 border-2 border-red-600 text-red-600 hover:bg-red-600 hover:text-white transition font-bold text-xl">−</button>
                            <input id="qty-input" type="number" min="1" value="1" class="w-20 h-12 bg-white border-2 border-gray-300 text-center text-lg font-bold text-red-600">
                            <button id="qty-plus" class="w-12 h-12 border-2 border-red-600 text-red-600 hover:bg-red-600 hover:text-white transition font-bold text-xl">+</button>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button id="btn-add-cart" class="flex-1 px-6 py-4 bg-red-600 text-white font-bold uppercase tracking-widest hover:bg-red-700 transition border-2 border-red-600">
                            Añadir al Carrito
                        </button>
                    </div>

                    <div class="mt-12 pt-8 border-t-2 border-gray-200">
                        <p class="text-gray-600 text-sm mb-4">
                            <span class="block font-bold text-red-600 mb-2">ENVÍO GRATUITO</span>
                            En compras mayores a $50 USD
                        </p>
                        <p class="text-gray-600 text-sm">
                            <span class="block font-bold text-red-600 mb-2">GARANTÍA 30 DÍAS</span>
                            Devoluciones sin complicaciones
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer id="booter-container" class="bg-black mt-10"></footer>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');
        let currentProduct = null;

        async function loadProductPage() {
            renderNavbar();
            renderFooter();

            try {
                const response = await fetch(`/api/products/${productId}`);
                currentProduct = await response.json();

                renderBreadcrumbContainer();

                renderProductData(currentProduct);
                updateStockIndicator(currentProduct);

                attachProductListeners();
            } catch (error) {
                document.getElementById('main-content').innerHTML = '<div class="text-center py-20 text-red-600"><p>Producto no encontrado</p></div>';
            }

            updateCartBadge();
        }

        function renderBreadcrumbContainer() {
            const container = document.getElementById('breadcrumb-container');
            container.innerHTML = renderBreadcrumb([
                { label: 'Inicio', href: 'index.html' },
                { label: 'Catálogo', href: 'catalog.html' },
                { label: currentProduct.name }
            ]);
        }

        function renderProductData(product) {
            document.getElementById('product-image').src = product.image_url || 'https://via.placeholder.com/300';
            document.getElementById('product-image').alt = product.name;
            document.getElementById('product-sku').textContent = product.sku;
            document.getElementById('product-name').textContent = product.name;
            document.getElementById('product-description').textContent = product.description;
            document.getElementById('product-price').textContent = `$${parseFloat(product.price).toFixed(2)}`;
        }

        function updateStockIndicator(product) {
            const btnAddCart = document.getElementById('btn-add-cart');
            const isOutOfStock = !product.isAvailable || product.currentStock === 0;

            if (isOutOfStock) {
                btnAddCart.textContent = 'Agotado';
                btnAddCart.disabled = true;
                btnAddCart.className = 'flex-1 px-6 py-4 bg-gray-400 text-white font-bold uppercase tracking-widest cursor-not-allowed border-2 border-gray-400';
            } else {
                btnAddCart.textContent = 'Añadir al Carrito';
                btnAddCart.disabled = false;
                btnAddCart.className = 'flex-1 px-6 py-4 bg-red-600 text-white font-bold uppercase tracking-widest hover:bg-red-700 transition border-2 border-red-600';
            }
        }

        function attachProductListeners() {
            document.getElementById('qty-minus').addEventListener('click', () => {
                const input = document.getElementById('qty-input');
                if (input.value > 1) input.value--;
            });

            document.getElementById('qty-plus').addEventListener('click', () => {
                document.getElementById('qty-input').value++;
            });

            document.getElementById('btn-add-cart').addEventListener('click', () => {
                const quantity = parseInt(document.getElementById('qty-input').value);
                addToCart(currentProduct, quantity);
                showNotification('Producto añadido al carrito', 'success');
            });
        }

        document.addEventListener('DOMContentLoaded', loadProductPage);
    </script>
</body>
</html>
