<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Riot Merch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-white text-gray-900 font-sans">
    <nav id="navbar-container" class="bg-black sticky top-0 z-50 shadow-md"></nav>
    <main id="main-content"></main>
    <footer id="booter-container" class="bg-black mt-20"></footer>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script>
        async function loadAdminPage() {
            renderNavbar();
            renderFooter();

            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = `
                        <section class="max-w-4xl mx-auto px-4 py-12">
                            <div class="bg-red-50 border-2 border-red-300 p-6 mb-8">
                                <p class="text-red-700 uppercase tracking-wider font-bold">⚠️ Vista de Administración Técnica</p>
                                <p class="text-red-600 text-sm mt-2">Esta sección es para pruebas del sistema. No se debe acceder desde producción.</p>
                            </div>

                            <div class="bg-gray-50 border-2 border-gray-300 p-8">
                                <h2 class="text-3xl font-black text-gray-900 uppercase tracking-tight mb-8">Simulador de Tráfico Flash Sale</h2>

                                <form id="traffic-form" class="space-y-8">
                                    <div>
                                        <label class="block text-gray-700 uppercase text-sm tracking-wider mb-4 font-bold">Producto Objetivo</label>
                                        <select id="product-select" class="w-full bg-white border-2 border-gray-300 px-4 py-3 text-gray-900 focus:border-red-600 focus:outline-none uppercase">
                                            <option value="">Cargando productos...</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label class="block text-gray-700 uppercase text-sm tracking-wider mb-4 font-bold">Cantidad de Peticiones en Lote</label>
                                        <div class="flex gap-4">
                                            <input type="number" id="batch-size" min="100" max="10000" value="1000" class="flex-1 bg-white border-2 border-gray-300 px-4 py-3 text-gray-900 focus:border-red-600 focus:outline-none">
                                            <div class="text-sm text-gray-600 flex items-center">
                                                <span class="px-4 py-3">peticiones</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-gray-700 uppercase text-sm tracking-wider mb-4 font-bold">Número de Ráfagas (Pulsos)</label>
                                        <div class="flex gap-4">
                                            <input type="number" id="burst-count" min="1" max="10" value="1" class="flex-1 bg-white border-2 border-gray-300 px-4 py-3 text-gray-900 focus:border-red-600 focus:outline-none">
                                            <div class="text-sm text-gray-600 flex items-center">
                                                <span class="px-4 py-3">pulsos</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-gray-700 uppercase text-sm tracking-wider mb-4 font-bold">Intervalo entre Ráfagas (ms)</label>
                                        <input type="number" id="burst-interval" min="100" max="5000" value="500" class="w-full bg-white border-2 border-gray-300 px-4 py-3 text-gray-900 focus:border-red-600 focus:outline-none">
                                    </div>

                                    <div class="bg-white border-2 border-gray-300 p-6">
                                        <p class="text-gray-600 uppercase text-xs tracking-wider mb-2 font-bold">Estimación Total de Peticiones</p>
                                        <p id="total-requests" class="text-3xl font-black text-red-600">0</p>
                                    </div>

                                    <button type="submit" class="w-full px-8 py-4 bg-red-600 text-white font-black uppercase tracking-widest text-lg border-2 border-red-600 hover:bg-red-700 transition">
                                        Ejecutar tráfico
                                    </button>
                                </form>

                                <div id="execution-status" class="mt-12 hidden">
                                    <div class="bg-white border-2 border-red-600 p-8">
                                        <p class="text-red-600 uppercase text-sm tracking-wider mb-4 font-bold">Estado de Ejecución</p>
                                        <div class="space-y-3">
                                            <div class="flex justify-between">
                                                <span class="text-gray-600">Ráfagas completadas</span>
                                                <span id="bursts-completed" class="text-red-600 font-bold">0 / 1</span>
                                            </div>
                                            <div class="flex justify-between">
                                                <span class="text-gray-600">Peticiones enviadas</span>
                                                <span id="requests-sent" class="text-red-600 font-bold">0</span>
                                            </div>
                                            <div class="flex justify-between">
                                                <span class="text-gray-600">Exitosas</span>
                                                <span id="requests-success" class="text-green-600 font-bold">0</span>
                                            </div>
                                            <div class="flex justify-between">
                                                <span class="text-gray-600">Fallidas</span>
                                                <span id="requests-failed" class="text-red-600 font-bold">0</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-gray-50 border-2 border-gray-300 p-8 mt-12">
                                <h3 class="text-xl font-black text-gray-900 uppercase tracking-tight mb-6">Información Técnica</h3>
                                <div class="space-y-4 text-sm text-gray-700">
                                    <p><span class="text-red-600 font-bold">Endpoint:</span> POST /api/generator/batch</p>
                                    <p><span class="text-red-600 font-bold">Body esperado:</span> { productId, quantity, batchCount }</p>
                                    <p><span class="text-red-600 font-bold">Respuesta:</span> JSON con metrics de ejecución</p>
                                    <p class="mt-6 text-gray-600">Este simulador envía peticiones masivas al backend para probar el rendimiento ante picos de tráfico.</p>
                                </div>
                            </div>
                        </section>
                    `;

            await loadProducts();
            setupAdminListeners();
            updateCartBadge();
        }

        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                const products = await response.json();
                const select = document.getElementById('product-select');
                select.innerHTML = products.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        function updateEstimation() {
            const batchSize = parseInt(document.getElementById('batch-size').value) || 0;
            const burstCount = parseInt(document.getElementById('burst-count').value) || 1;
            const total = batchSize * burstCount;
            document.getElementById('total-requests').textContent = total.toLocaleString();
        }

        function setupAdminListeners() {
            document.getElementById('batch-size').addEventListener('change', updateEstimation);
            document.getElementById('burst-count').addEventListener('change', updateEstimation);

            document.getElementById('traffic-form').addEventListener('submit', async (e) => {
                e.preventDefault();

                const productId = document.getElementById('product-select').value;
                const batchSize = parseInt(document.getElementById('batch-size').value);
                const burstCount = parseInt(document.getElementById('burst-count').value);
                const burstInterval = parseInt(document.getElementById('burst-interval').value);

                if (!productId) {
                    showNotification('Selecciona un producto', 'error');
                    return;
                }

                const statusDiv = document.getElementById('execution-status');
                statusDiv.classList.remove('hidden');

                document.getElementById('traffic-form').style.opacity = '0.5';
                document.querySelector('button[type="submit"]').disabled = true;

                let totalSent = 0, totalSuccess = 0, totalFailed = 0;

                for (let burst = 0; burst < burstCount; burst++) {
                    try {
                        const response = await fetch('/api/generator/batch', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                productId: productId,
                                quantity: batchSize,
                                batchCount: 1
                            })
                        });

                        const result = await response.json();
                        totalSent += batchSize;
                        totalSuccess += result.successCount || batchSize;
                        totalFailed += result.failureCount || 0;
                    } catch (error) {
                        totalFailed += batchSize;
                    }

                    document.getElementById('bursts-completed').textContent = `${burst + 1} / ${burstCount}`;
                    document.getElementById('requests-sent').textContent = totalSent;
                    document.getElementById('requests-success').textContent = totalSuccess;
                    document.getElementById('requests-failed').textContent = totalFailed;

                    if (burst < burstCount - 1) {
                        await new Promise(resolve => setTimeout(resolve, burstInterval));
                    }
                }

                document.getElementById('traffic-form').style.opacity = '1';
                document.querySelector('button[type="submit"]').disabled = false;
                showNotification('¡Simulación completada!', 'success');
            });

            updateEstimation();
        }

        document.addEventListener('DOMContentLoaded', loadAdminPage);
    </script>
</body>
</html>
