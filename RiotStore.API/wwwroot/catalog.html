<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Riot Merch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-white text-gray-900 font-sans">
    <nav id="navbar-container" class="bg-black sticky top-0 z-50 shadow-md"></nav>
    <main id="main-content"></main>
    <footer id="booter-container" class="bg-black mt-20"></footer>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script>
        let allProducts = [];

        async function loadCatalogPage() {
            renderNavbar();
            renderFooter();

            const mainContent = document.getElementById('main-content');
            const categories = await fetchCategories();
            allProducts = await fetchProducts();

            console.log('Productos cargados:', allProducts);
            console.log('Categorías cargadas:', categories);

            let categoriesHTML = categories.map(cat => `
                    <button class="filter-btn px-6 py-2 border-2 border-red-600 text-red-600 hover:bg-red-600 hover:text-white transition uppercase text-sm font-bold" data-category="${cat.category_id}">
                        ${cat.name}
                    </button>
                `).join('');

            let productsHTML = allProducts.map(product => renderProductCard(product)).join('');

            mainContent.innerHTML = `
                    <section class="bg-gray-50 border-b border-gray-200 py-6">
                        <div class="max-w-7xl mx-auto px-4">
                            <h2 class="text-2xl font-black text-gray-900 uppercase tracking-tight mb-6">Filtrar por Categoría</h2>
                            <div class="flex gap-3 flex-wrap">
                                <button class="filter-btn px-6 py-2 border-2 border-red-600 text-red-600 hover:bg-red-600 hover:text-white transition uppercase text-sm font-bold active" data-category="todos">
                                    Todos
                                </button>
                                ${categoriesHTML}
                            </div>
                        </div>
                    </section>

                    <section class="max-w-7xl mx-auto px-4 py-12">
                        <h1 class="text-4xl font-black text-red-600 uppercase tracking-tight mb-8">Catálogo de Productos</h1>
                        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            ${productsHTML}
                        </div>
                    </section>
                `;

            // Filtros
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active', 'bg-red-600', 'text-white'));
                    e.target.classList.add('active', 'bg-red-600', 'text-white');

                    const categoryId = e.target.dataset.category;
                    const productsGrid = document.getElementById('products-grid');

                    if (categoryId === 'todos') {
                        productsGrid.innerHTML = allProducts.map(p => renderProductCard(p)).join('');
                    } else {
                        const filtered = await fetchProductsByCategory(parseInt(categoryId));
                        productsGrid.innerHTML = filtered.map(p => renderProductCard(p)).join('');
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', loadCatalogPage);
    </script>
</body>
</html>
