<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Riot Merch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/custom.css">
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico" />
</head>
<body class="bg-white text-gray-900 font-sans">
    <nav id="navbar-container" class="bg-black sticky top-0 z-50 shadow-md"></nav>
    <main id="main-content">
        <section class="">
            <div class="max-w-7xl mx-auto px-4 py-12">
                <h1 class="text-4xl font-black text-red-600 uppercase tracking-tight">Catálogo de productos</h1>
            </div>
        </section>

        <div class="bg-gray-50 pt-6 pb-8">
            <div class="max-w-7xl mx-auto px-4">
                <h2 class="text-2xl font-black text-gray-900 uppercase tracking-tight mb-6">Filtrar por Categoría</h2>
                <div id="categories-container" class="flex gap-3 flex-wrap"></div>
            </div>
        </div>

        <section class=" max-w-7xl mx-auto px-4 py-12">
            <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </section>
    </main>
    <footer id="booter-container" class="bg-black mt-10"></footer>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script>
        let allProducts = [];

        async function loadCatalogPage() {
            renderNavbar();
            renderFooter();

            const categories = await fetchCategories();
            renderCategories(categories);

            allProducts = await fetchProducts();
            renderProductsGrid(allProducts);

            console.log('Productos cargados:', allProducts);

            attachFilterListeners();
        }

        function renderCategories(categories) {
            const container = document.getElementById('categories-container');

            const allBtn = `
                    <button class="filter-btn px-6 py-2 border-2 border-red-600 text-red-600 hover:bg-red-600 hover:text-white transition uppercase text-sm font-bold active" data-category="todos">
                        Todos
                    </button>
                `;

            const categoryBtns = categories.map(cat => `
                    <button class="filter-btn px-6 py-2 border-2 border-red-600 text-red-600 hover:bg-red-600 hover:text-white transition uppercase text-sm font-bold" data-category="${cat.category_id}">
                        ${cat.name}
                    </button>
                `).join('');

            container.innerHTML = allBtn + categoryBtns;
        }

        function renderProductsGrid(products) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = products.map(product => renderProductCard(product)).join('');
        }

        function attachFilterListeners() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const target = e.currentTarget;
                    const isActive = target.classList.contains('active');

                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('active', 'bg-red-600', 'text-white');
                        b.classList.add('text-red-600');
                    });

                    const productsGrid = document.getElementById('products-grid');

                    if (isActive) {
                        renderProductsGrid(allProducts);
                        return;
                    }

                    target.classList.add('active', 'bg-red-600', 'text-white');
                    target.classList.remove('text-red-600');

                    const categoryId = target.dataset.category;

                    if (categoryId === 'todos') {
                        renderProductsGrid(allProducts);
                    } else {
                        const filtered = await fetchProductsByCategory(parseInt(categoryId));
                        renderProductsGrid(filtered);
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', loadCatalogPage);
    </script>
</body>
</html>
