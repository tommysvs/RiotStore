<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador - Riot Merch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/custom.css">
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico" />
</head>
<body class="bg-white text-gray-900 font-sans">
    <nav id="navbar-container" class="bg-black sticky top-0 z-50 shadow-md"></nav>
    <main id="main-content">
        <section class="max-w-4xl mx-auto px-4 py-12">
            <h1 class="text-4xl font-black text-red-600 uppercase tracking-tight mb-12">Simulador de tráfico para Flash Sale</h1>

            <div class="bg-gray-50 border-2 border-gray-300 p-8">
                <form id="traffic-form" class="space-y-8">
                    <div>
                        <label for="batch-size" class="block text-gray-700 uppercase text-sm tracking-wider mb-4 font-bold">Cantidad de peticiones en lote</label>
                        <div class="flex gap-4">
                            <input id="batch-size" type="number" min="100" max="10000" value="1000" class="flex-1 bg-white border-2 border-gray-300 px-4 py-3 text-gray-900 focus:border-red-600 focus:outline-none">
                            <div class="text-sm text-gray-600 flex items-center">
                                <span class="px-4 py-3">peticiones</span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label for="burst-count" class="block text-gray-700 uppercase text-sm tracking-wider mb-4 font-bold">Número de ráfagas (pulsos)</label>
                        <div class="flex gap-4">
                            <input id="burst-count" type="number" min="1" max="10" value="1" class="flex-1 bg-white border-2 border-gray-300 px-4 py-3 text-gray-900 focus:border-red-600 focus:outline-none">
                            <div class="text-sm text-gray-600 flex items-center">
                                <span class="px-4 py-3">pulsos</span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label for="burst-interval" class="block text-gray-700 uppercase text-sm tracking-wider mb-4 font-bold">Intervalo entre ráfagas (ms)</label>
                        <input id="burst-interval" type="number" min="100" max="5000" value="500" class="w-full bg-white border-2 border-gray-300 px-4 py-3 text-gray-900 focus:border-red-600 focus:outline-none">
                    </div>

                    <div class="bg-white border-2 border-gray-300 p-6">
                        <p class="text-gray-600 uppercase text-xs tracking-wider mb-2 font-bold">Estimación total de peticiones</p>
                        <p id="total-requests" class="text-3xl font-black text-red-600">0</p>
                    </div>

                    <button type="submit" class="w-full px-8 py-4 bg-red-600 text-white font-black uppercase tracking-widest text-lg border-2 border-red-600 hover:bg-red-700 transition">
                        Ejecutar
                    </button>
                </form>

                <div id="execution-status" class="mt-12 hidden">
                    <div class="bg-white border-2 border-red-600 p-8">
                        <p class="text-red-600 uppercase text-sm tracking-wider mb-4 font-bold">Estado de ejecución</p>
                        <div class="space-y-3">
                            <div class="flex justify-between">
                                <span class="text-gray-600">Ráfagas completadas</span>
                                <span id="bursts-completed" class="text-red-600 font-bold">0 / 1</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-600">Peticiones enviadas a Kafka</span>
                                <span id="requests-sent" class="text-red-600 font-bold">0</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-600">Tiempo total (segundos)</span>
                                <span id="elapsed-time" class="text-red-600 font-bold">-</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-600">Throughput (peticiones/segundo)</span>
                                <span id="throughput-result" class="text-red-600 font-bold">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer id="booter-container" class="bg-black mt-10"></footer>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script>
        async function loadSimulatorPage() {
            renderNavbar();
            renderFooter();
            attachSimulatorListeners();
            updateCartBadge();
        }

        function attachSimulatorListeners() {
            const form = document.getElementById('traffic-form');
            const batchSizeInput = document.getElementById('batch-size');
            const burstCountInput = document.getElementById('burst-count');

            function updateTotalRequests() {
                const batchSize = parseInt(batchSizeInput.value) || 0;
                const burstCount = parseInt(burstCountInput.value) || 1;
                const totalRequests = batchSize * burstCount;
                document.getElementById('total-requests').textContent = totalRequests.toLocaleString('es-ES');
            }

            batchSizeInput.addEventListener('input', updateTotalRequests);
            burstCountInput.addEventListener('input', updateTotalRequests);
            updateTotalRequests();

            form.addEventListener('submit', executeSimulation);
        }

        async function executeSimulation(e) {
            e.preventDefault();

            const batchSize = parseInt(document.getElementById('batch-size').value);
            const burstCount = parseInt(document.getElementById('burst-count').value);
            const burstInterval = parseInt(document.getElementById('burst-interval').value);

            const executionStatus = document.getElementById('execution-status');
            executionStatus.classList.remove('hidden');

            let totalSent = 0;
            const startTime = Date.now();

            for (let burst = 0; burst < burstCount; burst++) {
                try {
                    const response = await fetch('/api/simulator/batch-metrics', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            quantity: batchSize,
                            batchCount: 1
                        })
                    });

                    const data = await response.json();
                    totalSent += data.totalRequests;

                    document.getElementById('bursts-completed').textContent = `${burst + 1} / ${burstCount}`;
                    document.getElementById('requests-sent').textContent = totalSent.toLocaleString('es-ES');

                    if (burst < burstCount - 1) {
                        await new Promise(resolve => setTimeout(resolve, burstInterval));
                    }
                } catch (error) {
                    console.error('Error en ráfaga', burst + 1, ':', error);
                }
            }

            const endTime = Date.now();
            const elapsedSeconds = (endTime - startTime) / 1000;
            const throughput = elapsedSeconds > 0 ? (totalSent / elapsedSeconds).toFixed(2) : 0;

            document.getElementById('throughput-result').textContent = throughput.toLocaleString('es-ES');
            document.getElementById('elapsed-time').textContent = elapsedSeconds.toFixed(2);
        }

        document.addEventListener('DOMContentLoaded', loadSimulatorPage);
    </script>
</body>
</html>
