<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación - Riot Merch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-white text-gray-900 font-sans">
    <nav id="navbar-container" class="bg-black sticky top-0 z-50 shadow-md"></nav>
    <main id="main-content"></main>
    <footer id="booter-container" class="bg-black mt-20"></footer>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar();
            renderFooter();

            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('orderId') || 'ORD-' + Date.now();

            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = `
                        <section class="max-w-3xl mx-auto px-4 py-20 text-center">
                            <div class="mb-8">
                                <div class="inline-flex items-center justify-center w-24 h-24 bg-green-600 text-white rounded-full mb-6">
                                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </div>
                            </div>

                            <h1 class="text-5xl font-black text-red-600 uppercase tracking-tight mb-6">
                                ¡Compra confirmada!
                            </h1>

                            <p class="text-xl text-gray-600 mb-8">
                                Tu pedido ha sido procesado exitosamente. Recibirás un email de confirmación con los detalles de tu compra.
                            </p>

                            <div class="bg-gray-50 border-2 border-gray-300 p-8 mb-12">
                                <p class="text-gray-600 uppercase text-sm tracking-wider mb-2 font-bold">Número de Orden</p>
                                <p class="text-3xl font-black text-red-600 uppercase tracking-widest">${orderId}</p>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                                <div class="bg-gray-50 border-2 border-gray-300 p-6">
                                    <p class="text-red-600 font-bold uppercase text-sm tracking-wider mb-2">Estado</p>
                                    <p class="text-lg text-gray-900">Procesado</p>
                                </div>
                                <div class="bg-gray-50 border-2 border-gray-300 p-6">
                                    <p class="text-red-600 font-bold uppercase text-sm tracking-wider mb-2">Envío Estimado</p>
                                    <p class="text-lg text-gray-900">3-5 Días Hábiles</p>
                                </div>
                                <div class="bg-gray-50 border-2 border-gray-300 p-6">
                                    <p class="text-red-600 font-bold uppercase text-sm tracking-wider mb-2">Rastreo</p>
                                    <p class="text-lg text-gray-900">Próximamente</p>
                                </div>
                            </div>

                            <div class="flex flex-col md:flex-row gap-4 justify-center">
                                <a href="index.html" class="px-8 py-4 bg-red-600 text-white font-bold uppercase tracking-widest hover:bg-red-700 transition border-2 border-red-600">
                                    Volver a inicio
                                </a>
                                <a href="catalog.html" class="px-8 py-4 bg-gray-900 text-white font-bold uppercase tracking-widest hover:bg-black transition border-2 border-gray-900">
                                    Seguir comprando
                                </a>
                            </div>
                        </section>
                    `;

            clearCart();
            updateCartBadge();
        });
    </script>
</body>
</html>
