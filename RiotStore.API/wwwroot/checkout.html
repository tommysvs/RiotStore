<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Riot Merch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-white text-gray-900 font-sans">
    <nav id="navbar-container" class="bg-black sticky top-0 z-50 shadow-md"></nav>
    <main id="main-content"></main>
    <footer id="booter-container" class="bg-black mt-20"></footer>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script>
        async function loadCheckoutPage() {
            const cart = getCart();
            if (cart.length === 0) {
                window.location.href = 'cart.html';
                return;
            }

            renderNavbar();
            renderFooter();

            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = `
                            <section class="max-w-7xl mx-auto px-4 py-12">
                                <h1 class="text-4xl font-black text-gray-900 uppercase tracking-tight mb-12">Checkout</h1>

                                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    <div class="lg:col-span-2">
                                        <div class="bg-gray-50 border border-gray-300 p-8 mb-8">
                                            <h2 class="text-2xl font-black text-gray-900 uppercase tracking-tight mb-6">Datos de envío</h2>
                                            <form id="shipping-form" class="space-y-6">
                                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                    ${renderInput('fullname', 'Nombre completo', 'text', true)}
                                                    ${renderInput('email', 'Email', 'email', true)}
                                                </div>

                                                ${renderInput('address', 'Dirección', 'text', true)}

                                                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                                    ${renderInput('city', 'Ciudad', 'text', true)}
                                                    ${renderInput('state', 'Estado', 'text', true)}
                                                    ${renderInput('zipcode', 'Código postal', 'text', true)}
                                                </div>
                                            </form>
                                        </div>

                                        <div class="bg-gray-50 border border-gray-300 p-8">
                                            <h2 class="text-2xl font-black text-gray-900 uppercase tracking-tight mb-6">Método de Pago</h2>
                                            <div class="space-y-4">
                                                <label class="flex items-center p-4 border-2 border-red-600 bg-white cursor-pointer hover:bg-red-50 transition">
                                                    <input type="radio" name="payment-method" value="credit-card" checked class="w-4 h-4">
                                                    <span class="ml-4 text-gray-900 font-semibold uppercase tracking-wider">Tarjeta de crédito</span>
                                                </label>
                                                <label class="flex items-center p-4 border-2 border-gray-300 bg-white cursor-pointer hover:bg-gray-50 transition">
                                                    <input type="radio" name="payment-method" value="paypal" class="w-4 h-4">
                                                    <span class="ml-4 text-gray-900 font-semibold uppercase tracking-wider">PayPal</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="bg-gray-50 border border-gray-300 p-8 h-fit sticky top-24">
                                        <h2 class="text-2xl font-black text-gray-900 uppercase tracking-tight mb-6">Resumen del pedido</h2>

                                        <div id="order-items" class="space-y-4 mb-8 pb-8 border-b-2 border-gray-200">
                                            ${cart.map(item => `
                                                <div class="text-sm">
                                                    <p class="text-gray-900 mb-1 font-semibold">${item.name}</p>
                                                    <p class="text-gray-600">x${item.quantity} @ ${formatPrice(item.price)} = <span class="text-red-600 font-bold">${formatPrice(item.price * item.quantity)}</span></p>
                                                </div>
                                            `).join('')}
                                        </div>

                                        <div class="space-y-4 mb-8 pb-8 border-b-2 border-gray-200">
                                            <div class="flex justify-between">
                                                <span class="text-gray-600 uppercase text-sm tracking-wider">Subtotal</span>
                                                <span id="summary-subtotal" class="font-bold text-gray-900">$0.00</span>
                                            </div>
                                            <div class="flex justify-between">
                                                <span class="text-gray-600 uppercase text-sm tracking-wider">Impuestos (15%)</span>
                                                <span id="summary-taxes" class="font-bold text-gray-900">$0.00</span>
                                            </div>
                                            <div class="flex justify-between">
                                                <span class="text-gray-600 uppercase text-sm tracking-wider">Envío</span>
                                                <span class="font-bold text-gray-900">Gratis</span>
                                            </div>
                                        </div>

                                        <div class="flex justify-between mb-8">
                                            <span class="text-lg font-black text-red-600 uppercase tracking-wider">Total</span>
                                            <span id="summary-total" class="text-2xl font-black text-gray-900">$0.00</span>
                                        </div>

                                        <button id="confirm-purchase" class="w-full px-6 py-4 bg-red-600 text-white font-bold uppercase tracking-widest hover:bg-red-700 transition border-2 border-red-600">
                                            Confirmar Compra
                                        </button>
                                    </div>
                                </div>
                            </section>
                        `;

            updateOrderSummary();
            setupCheckoutListeners();
            updateCartBadge();
        }

        function updateOrderSummary() {
            const cart = getCart();
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const taxes = subtotal * 0.15;
            const total = subtotal + taxes;

            document.getElementById('summary-subtotal').textContent = formatPrice(subtotal);
            document.getElementById('summary-taxes').textContent = formatPrice(taxes);
            document.getElementById('summary-total').textContent = formatPrice(total);
        }

        function setupCheckoutListeners() {
            document.getElementById('confirm-purchase').addEventListener('click', async () => {
                const form = document.getElementById('shipping-form');
                if (!form.checkValidity()) {
                    showNotification('Por favor completa todos los campos', 'error');
                    return;
                }

                const cart = getCart();
                const orderData = {
                    customer: {
                        fullName: document.getElementById('fullname').value,
                        email: document.getElementById('email').value,
                        address: document.getElementById('address').value,
                        city: document.getElementById('city').value,
                        state: document.getElementById('state').value,
                        zipCode: document.getElementById('zipcode').value
                    },
                    items: cart,
                    paymentMethod: document.querySelector('input[name="payment-method"]:checked').value,
                    timestamp: new Date().toISOString()
                };

                try {
                    const response = await fetch('/api/checkout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(orderData)
                    });

                    if (response.ok) {
                        const result = await response.json();
                        clearCart();
                        window.location.href = `confirmation.html?orderId=${result.orderId}`;
                    } else {
                        showNotification('Error al procesar el pedido', 'error');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showNotification('Error de conexión', 'error');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', loadCheckoutPage);
    </script>
</body>
</html>
