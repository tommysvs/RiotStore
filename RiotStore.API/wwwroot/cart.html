<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Riot Merch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-white text-gray-900 font-sans">
    <nav id="navbar-container" class="bg-black sticky top-0 z-50 shadow-md"></nav>
    <main id="main-content"></main>
    <footer id="booter-container" class="bg-black mt-20"></footer>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script>
        async function loadCartPage() {
            renderNavbar();
            renderFooter();

            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = `
                        <section class="max-w-7xl mx-auto px-4 py-12">
                            <h1 class="text-4xl font-black text-gray-900 uppercase tracking-tight mb-12">Tu Carrito</h1>

                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div class="lg:col-span-2">
                                    <div id="empty-cart" class="bg-gray-50 border-2 border-gray-300 p-12 text-center">
                                        <p class="text-gray-600 text-lg uppercase tracking-wider">Tu carrito está vacío</p>
                                        <a href="catalog.html" class="inline-block mt-6 px-8 py-3 bg-red-600 text-white font-bold uppercase tracking-widest hover:bg-red-700 transition">
                                            Volver al Catálogo
                                        </a>
                                    </div>

                                    <div id="cart-items" class="hidden space-y-4">
                                        <!-- Cargado dinámicamente -->
                                    </div>
                                </div>

                                <div class="bg-gray-50 border border-gray-300 p-8 h-fit sticky top-24">
                                    <h2 class="text-2xl font-black text-gray-900 uppercase tracking-tight mb-6">Resumen</h2>

                                    <div class="space-y-4 mb-8 pb-8 border-b-2 border-gray-200">
                                        <div class="flex justify-between">
                                            <span class="text-gray-600 uppercase text-sm tracking-wider">Subtotal</span>
                                            <span id="subtotal" class="font-bold text-gray-900">$0.00</span>
                                        </div>
                                        <div class="flex justify-between">
                                            <span class="text-gray-600 uppercase text-sm tracking-wider">Impuestos (10%)</span>
                                            <span id="taxes" class="font-bold text-gray-900">$0.00</span>
                                        </div>
                                        <div class="flex justify-between">
                                            <span class="text-gray-600 uppercase text-sm tracking-wider">Envío</span>
                                            <span id="shipping" class="font-bold text-gray-900">Gratis</span>
                                        </div>
                                    </div>

                                    <div class="flex justify-between mb-8">
                                        <span class="text-lg font-black text-red-600 uppercase tracking-wider">Total</span>
                                        <span id="total" class="text-2xl font-black text-gray-900">$0.00</span>
                                    </div>

                                    <button id="checkout-btn" class="w-full px-6 py-4 bg-red-600 text-white font-bold uppercase tracking-widest hover:bg-red-700 transition border-2 border-red-600 disabled:opacity-50 disabled:cursor-not-allowed">
                                        Proceder al Checkout
                                    </button>
                                </div>
                            </div>
                        </section>
                    `;

            renderCart();
            updateCartBadge();
        }

        function renderCart() {
            const cart = getCart();
            const emptyCart = document.getElementById('empty-cart');
            const cartItems = document.getElementById('cart-items');

            if (cart.length === 0) {
                emptyCart.classList.remove('hidden');
                cartItems.classList.add('hidden');
                document.getElementById('checkout-btn').disabled = true;
                updateTotals(cart);
                return;
            }

            emptyCart.classList.add('hidden');
            cartItems.classList.remove('hidden');
            cartItems.innerHTML = cart.map((item, index) => `
                        <div class="bg-white border border-gray-200 p-6 flex gap-6 hover:shadow-md transition">
                            <img src="${item.image_url}" alt="${item.name}" class="w-24 h-24 object-cover border border-gray-300">
                            <div class="flex-1">
                                <p class="text-red-600 text-xs uppercase tracking-wider font-bold mb-1">${item.sku}</p>
                                <h3 class="text-lg font-bold text-gray-900 uppercase mb-2">${item.name}</h3>
                                <p class="text-2xl font-black text-gray-900 mb-4">${formatPrice(item.price)}</p>
                                <div class="flex gap-3 items-center">
                                    <button class="remove-item w-8 h-8 border-2 border-red-600 text-red-600 hover:bg-red-600 hover:text-white transition font-bold" data-index="${index}">×</button>
                                    <div class="flex gap-2 items-center border-2 border-red-600">
                                        <button class="qty-decrease w-8 h-8 text-red-600 hover:bg-red-600 hover:text-white transition font-bold" data-index="${index}">−</button>
                                        <span class="w-8 text-center font-bold text-red-600">${item.quantity}</span>
                                        <button class="qty-increase w-8 h-8 text-red-600 hover:bg-red-600 hover:text-white transition font-bold" data-index="${index}">+</button>
                                    </div>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-sm text-gray-600 mb-2">Subtotal</p>
                                <p class="text-xl font-black text-gray-900">${formatPrice(item.price * item.quantity)}</p>
                            </div>
                        </div>
                    `).join('');

            document.getElementById('checkout-btn').disabled = false;

            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    removeFromCart(parseInt(btn.dataset.index));
                    renderCart();
                });
            });

            document.querySelectorAll('.qty-decrease').forEach(btn => {
                btn.addEventListener('click', () => {
                    const index = parseInt(btn.dataset.index);
                    const newQty = Math.max(1, getCart()[index].quantity - 1);
                    updateQuantity(index, newQty);
                    renderCart();
                });
            });

            document.querySelectorAll('.qty-increase').forEach(btn => {
                btn.addEventListener('click', () => {
                    const index = parseInt(btn.dataset.index);
                    updateQuantity(index, getCart()[index].quantity + 1);
                    renderCart();
                });
            });

            updateTotals(cart);
        }

        function updateTotals(cart) {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const taxes = subtotal * 0.1;
            const total = subtotal + taxes;

            document.getElementById('subtotal').textContent = formatPrice(subtotal);
            document.getElementById('taxes').textContent = formatPrice(taxes);
            document.getElementById('total').textContent = formatPrice(total);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCartPage();
            document.getElementById('checkout-btn').addEventListener('click', () => {
                window.location.href = 'checkout.html';
            });
        });
    </script>
</body>
</html>
